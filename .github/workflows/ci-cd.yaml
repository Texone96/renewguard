name: ci-cd
on:
  push:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/renewguard-api

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to Kubernetes (minikube)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          sed -e "s|IMAGE_PLACEHOLDER|$IMAGE:$GITHUB_SHA|" \
              -e "s|GIT_SHA_PLACEHOLDER|${GITHUB_SHA::7}|" k8s/*.yaml \
            | ssh ubuntu@"$EC2_HOST" "kubectl apply -f -"
          ssh ubuntu@"$EC2_HOST" "kubectl rollout status deployment/renewguard-api --timeout=180s"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish web page to S3
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          echo "window.API_URL='http://${EC2_HOST}:30080';" > web/config.js
          aws s3 sync web/ "s3://${BUCKET}" --delete

      - name: Slack notification
        if: always()
        env:
          HOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          icon=$([ "$STATUS" = "success" ] && echo ":white_check_mark:" || echo ":x:")
          jq -n --arg t "$icon Pipeline $STATUS | ${GITHUB_REPOSITORY} | ${GITHUB_SHA::7} | image: $IMAGE:${GITHUB_SHA::7} | commit: $MSG" '{text:$t}' \
            | curl -s -X POST -H 'Content-type: application/json' --data @- "$HOOK"
