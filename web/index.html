<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RenewGuard</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1c2333;--mute:#667085;--line:#e4e8f0;--accent:#4457d9;--accent2:#e9ecff;
--ok:#15803d;--okbg:#dcfce7;--soon:#b45309;--soonbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45}
.top{background:linear-gradient(120deg,#2b3a8f,#4457d9);color:#fff;padding:22px 16px 56px}
.brand{max-width:1000px;margin:0 auto;display:flex;gap:14px;align-items:center}
.logo{width:46px;height:46px;border-radius:12px;background:#ffffff26;display:grid;place-items:center;font-weight:800;font-size:22px}
h1{margin:0;font-size:26px}
.brand p{margin:2px 0 0;opacity:.85;font-size:14px}
main{max-width:1000px;margin:-36px auto 0;padding:0 16px 32px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 4px 14px #1c23330d;border:1px solid var(--line)}
.tile b{display:block;font-size:28px;line-height:1.1}
.tile span{color:var(--mute);font-size:13px}
.tile.soon b{color:var(--soon)}.tile.bad b{color:var(--bad)}.tile.ok b{color:var(--ok)}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 14px #1c23330d}
h2{margin:0 0 12px;font-size:17px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=date],input[type=email],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
.drop{display:block;border:2px dashed #c5cbe0;border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:#fafbff}
.drop:hover{border-color:var(--accent);background:var(--accent2)}
.drop b{display:block;font-size:14px;word-break:break-all}.drop span{font-size:12px;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;font-size:13px;font-weight:600}
button:hover{background:#f6f7fb}
button.main{width:100%;margin-top:16px;padding:12px;background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px}
button.main:hover{background:#3548c4}button.main:disabled{opacity:.6;cursor:wait}
button.danger{color:var(--bad)}
.doc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.doc.soon{border-left-color:#f59e0b}.doc.expired{border-left-color:#ef4444}
.ico{width:46px;height:46px;border-radius:10px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.5px}
.t{font-weight:700;font-size:16px}.m{color:var(--mute);font-size:13px}
.r{text-align:right}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.soon{background:var(--soonbg);color:var(--soon)}.pill.expired{background:var(--badbg);color:var(--bad)}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.empty{background:var(--card);border:1px dashed #c5cbe0;border-radius:12px;padding:32px;text-align:center;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:#1c2333;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;max-width:90vw;z-index:9}
#toast.show{transform:translateX(-50%);opacity:1}#toast.bad{background:#b91c1c}#toast.ok{background:#15803d}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 16px 28px}
</style></head><body>
<div class="top"><div class="brand"><div class="logo">R</div>
<div><h1>RenewGuard</h1><p>Upload licenses, insurance and subscriptions. We remind you before they expire.</p></div></div></div>
<main>
 <div class="tiles">
  <div class="tile ok"><b id="n-all">0</b><span>Documents</span></div>
  <div class="tile soon"><b id="n-soon">0</b><span>Expiring soon</span></div>
  <div class="tile bad"><b id="n-exp">0</b><span>Expired</span></div>
 </div>
 <div class="grid">
  <section class="card">
   <h2>Add a document</h2>
   <form id="f" autocomplete="off">
    <label class="drop" for="file"><b id="fname">Choose a file</b><span>PDF, JPG or PNG, up to 8 MB</span></label>
    <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" hidden>
    <label class="f" for="title">Name</label>
    <input type="text" id="title" maxlength="60" placeholder="e.g. Car insurance">
    <label class="f" for="type">Type</label>
    <select id="type"><option>License</option><option selected>Insurance</option><option>Subscription</option><option>Passport</option><option>Warranty</option><option>Other</option></select>
    <label class="f" for="expiry">Expiry date</label>
    <input type="date" id="expiry">
    <label class="f" for="remind">Remind me</label>
    <select id="remind"><option value="7">7 days before</option><option value="14">14 days before</option><option value="30" selected>30 days before</option><option value="60">60 days before</option><option value="90">90 days before</option></select>
    <label class="f" for="email">Email for reminders (optional)</label>
    <input type="email" id="email" maxlength="120" placeholder="you@example.com">
    <label class="chk"><input type="checkbox" id="enh" checked> Clean up photos of documents (resize, fix contrast, sharpen)</label>
    <button class="main" id="save" type="submit">Save document</button>
   </form>
  </section>
  <section>
   <h2>Your documents</h2>
   <div id="list"></div>
  </section>
 </div>
</main>
<div id="toast"></div>
<footer id="foot">connecting...</footer>
<script src="config.js"></script>
<script>
const API=window.API_URL,$=id=>document.getElementById(id);
const ABBR={License:'LIC',Insurance:'INS',Subscription:'SUB',Passport:'PASS',Warranty:'WAR',Other:'DOC'};
let ws=null;
try{ws=localStorage.getItem('rg_ws');}catch(e){}
if(!ws){const a=new Uint8Array(16);crypto.getRandomValues(a);ws=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');try{localStorage.setItem('rg_ws',ws);}catch(e){}}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function toast(msg,kind){const t=$('toast');t.textContent=msg;t.className='show '+(kind||'');clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className='';},4500);}
async function api(path,opts){
 opts=opts||{};
 const r=await fetch(API+path,Object.assign({},opts,{headers:Object.assign({'X-Workspace':ws},opts.headers||{})}));
 let j=null;try{j=await r.json();}catch(e){}
 return {ok:r.ok,status:r.status,data:j};
}
const day=n=>n+' day'+(Math.abs(n)===1?'':'s');
function fmtDate(iso){return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';}
function pillText(d){
 if(d.status==='expired')return 'Expired '+day(-d.days_left)+' ago';
 if(d.days_left===0)return 'Expires today';
 return d.status==='soon'?'Expires in '+day(d.days_left):'Valid for '+day(d.days_left);
}

function render(docs){
 $('n-all').textContent=docs.length;
 $('n-soon').textContent=docs.filter(d=>d.status==='soon').length;
 $('n-exp').textContent=docs.filter(d=>d.status==='expired').length;
 const box=$('list');box.replaceChildren();
 if(!docs.length){box.appendChild(el('div','empty','No documents yet. Add your first license, policy or subscription.'));return;}
 for(const d of docs){
  const card=el('div','doc '+d.status);
  card.appendChild(el('div','ico',ABBR[d.type]||'DOC'));
  const info=el('div');
  info.appendChild(el('div','t',d.title));
  info.appendChild(el('div','m',d.type+' · '+d.filename+' · '+fmtSize(d.size)+(d.enhanced?' · cleaned up':'')));
  info.appendChild(el('div','m','Reminder '+day(d.remind_days)+' before'+(d.has_email?' · email on':'')));
  card.appendChild(info);
  const right=el('div','r');
  right.appendChild(el('span','pill '+d.status,pillText(d)));
  right.appendChild(el('div','m',fmtDate(d.expiry)));
  card.appendChild(right);
  const acts=el('div','acts');
  const open=el('button',null,'Open');open.onclick=()=>window.open(API+'/api/documents/'+d.id+'/file?ws='+ws,'_blank');
  const rem=el('button',null,'Send reminder now');rem.onclick=()=>remindNow(d);
  const ren=el('button',null,'Mark renewed');ren.onclick=()=>renew(d);
  const del=el('button','danger','Delete');del.onclick=()=>remove(d);
  acts.append(open,rem,ren,del);card.appendChild(acts);
  box.appendChild(card);
 }
}

async function load(){
 try{
  const r=await api('/api/documents');
  if(!r.ok)throw new Error('bad status');
  render(r.data);
  const h=await (await fetch(API+'/health')).json();
  $('foot').textContent='Your documents are private to this browser (workspace '+ws.slice(0,8)+'). Backend '+h.version+' · pod '+h.pod;
 }catch(e){
  $('list').replaceChildren(el('div','empty','Cannot reach the server. Check that the API is running.'));
  $('foot').textContent='backend unreachable';
 }
}

async function remindNow(d){
 const r=await api('/api/documents/'+d.id+'/remind',{method:'POST'});
 if(!r.ok)return toast('Could not send the reminder','bad');
 if(!r.data.configured)return toast('No notification channel is set up on the server','bad');
 const names=Object.keys(r.data.sent),failed=names.filter(n=>!r.data.sent[n]);
 failed.length?toast('Failed: '+failed.join(', '),'bad'):toast('Reminder sent via '+names.join(' and '),'ok');
}
async function renew(d){
 const v=prompt('New expiry date for "'+d.title+'" (YYYY-MM-DD):');
 if(!v)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return toast('Use the format YYYY-MM-DD','bad');
 const r=await api('/api/documents/'+d.id+'/renew',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiry:v})});
 r.ok?(toast('Marked as renewed','ok'),load()):toast('Invalid date','bad');
}
async function remove(d){
 if(!confirm('Delete "'+d.title+'"? The file is removed permanently.'))return;
 const r=await api('/api/documents/'+d.id,{method:'DELETE'});
 r.ok?(toast('Deleted','ok'),load()):toast('Could not delete','bad');
}

$('file').addEventListener('change',()=>{
 const f=$('file').files[0];
 $('fname').textContent=f?f.name+' ('+fmtSize(f.size)+')':'Choose a file';
 if(f&&!$('title').value)$('title').value=f.name.replace(/\.[^.]+$/,'').slice(0,60);
});
$('f').addEventListener('submit',async e=>{
 e.preventDefault();
 const f=$('file').files[0];
 if(!f)return toast('Choose a file first','bad');
 if(f.size>8*1024*1024)return toast('The file is larger than 8 MB','bad');
 if(!$('title').value.trim())return toast('Give the document a name','bad');
 if(!$('expiry').value)return toast('Pick the expiry date','bad');
 const fd=new FormData();
 fd.append('file',f);fd.append('title',$('title').value.trim());fd.append('type',$('type').value);
 fd.append('expiry',$('expiry').value);fd.append('remind_days',$('remind').value);
 fd.append('email',$('email').value.trim());fd.append('enhance',$('enh').checked?'1':'0');
 const b=$('save');b.disabled=true;b.textContent='Uploading...';
 try{
  const r=await api('/api/documents',{method:'POST',body:fd});
  if(r.ok){toast('Saved. You will be reminded '+day(+$('remind').value)+' before it expires.','ok');
   $('f').reset();$('fname').textContent='Choose a file';load();}
  else toast((r.data&&r.data.error)||'Upload failed','bad');
 }catch(err){toast('Server unreachable','bad');}
 b.disabled=false;b.textContent='Save document';
});
load();
</script></body></html>
