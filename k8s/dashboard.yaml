---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renewguard-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  renewguard.json: |
    {"title":"RenewGuard - Scaling & Infra","uid":"renewguard","schemaVersion":39,"refresh":"5s","time":{"from":"now-15m","to":"now"},"panels":[{"id":1,"type":"timeseries","title":"Replicas: current / desired / max / min","gridPos":{"x":0,"y":0,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=\"renewguard-api\"}","legendFormat":"current"},{"refId":"B","expr":"kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"renewguard-api\"}","legendFormat":"desired"},{"refId":"C","expr":"kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=\"renewguard-api\"}","legendFormat":"max"},{"refId":"D","expr":"kube_horizontalpodautoscaler_spec_min_replicas{horizontalpodautoscaler=\"renewguard-api\"}","legendFormat":"min"}]},{"id":2,"type":"timeseries","title":"App CPU usage vs requests, % (HPA target = 50)","gridPos":{"x":12,"y":0,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","expr":"100*sum(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod=~\"renewguard-api-.*\",container=\"api\"}[1m]))/sum(kube_pod_container_resource_requests{namespace=\"default\",pod=~\"renewguard-api-.*\",container=\"api\",resource=\"cpu\"})","legendFormat":"cpu % of request"}]},{"id":3,"type":"timeseries","title":"CPU per pod (cores)","gridPos":{"x":0,"y":8,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by (pod)(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod=~\"renewguard-api-.*\",container=\"api\"}[1m]))","legendFormat":"{{pod}}"}]},{"id":4,"type":"timeseries","title":"Memory per pod","gridPos":{"x":12,"y":8,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"bytes"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by (pod)(container_memory_working_set_bytes{namespace=\"default\",pod=~\"renewguard-api-.*\",container=\"api\"})","legendFormat":"{{pod}}"}]},{"id":5,"type":"timeseries","title":"Pod restarts","gridPos":{"x":0,"y":16,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by (pod)(kube_pod_container_status_restarts_total{namespace=\"default\",pod=~\"renewguard-api-.*\"})","legendFormat":"{{pod}}"}]},{"id":6,"type":"timeseries","title":"Running pods","gridPos":{"x":12,"y":16,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"count(kube_pod_status_phase{namespace=\"default\",pod=~\"renewguard-api-.*\",phase=\"Running\"}==1)","legendFormat":"running"}]},{"id":7,"type":"timeseries","title":"Node CPU %","gridPos":{"x":0,"y":24,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","expr":"100-avg(rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))*100","legendFormat":"node cpu"}]},{"id":8,"type":"timeseries","title":"Node memory %","gridPos":{"x":12,"y":24,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","expr":"100*(1-node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)","legendFormat":"node mem"}]},{"id":9,"type":"timeseries","title":"Scan clean-ups / sec","gridPos":{"x":0,"y":32,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"reqps"},"overrides":[]},"targets":[{"refId":"A","expr":"sum(rate(renewguard_enhance_seconds_count[1m]))","legendFormat":"clean-ups/s"}]},{"id":10,"type":"timeseries","title":"p95 clean-up time","gridPos":{"x":12,"y":32,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"s"},"overrides":[]},"targets":[{"refId":"A","expr":"histogram_quantile(0.95,sum by (le)(rate(renewguard_enhance_seconds_bucket[1m])))","legendFormat":"p95"}]},{"id":11,"type":"timeseries","title":"Documents by status","gridPos":{"x":0,"y":40,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"max by (status)(renewguard_documents)","legendFormat":"{{status}}"}]},{"id":12,"type":"timeseries","title":"Reminder jobs succeeded","gridPos":{"x":12,"y":40,"w":12,"h":8},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"sum(kube_job_status_succeeded{namespace=\"default\",job_name=~\"renewguard-reminders.*\"})","legendFormat":"succeeded jobs"}]}]}
