---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renewguard-api
spec:
  selector:
    matchLabels: {app: renewguard-api}
  template:
    metadata:
      labels: {app: renewguard-api}
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          envFrom:
            - secretRef: {name: renewguard-secrets}
          env:
            - {name: REDIS_HOST, value: redis}
            - {name: APP_VERSION, value: GIT_SHA_PLACEHOLDER}
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: renewguard-api
  labels: {app: renewguard-api}
spec:
  type: NodePort
  selector: {app: renewguard-api}
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: renewguard-api
  labels: {release: monitoring}
spec:
  selector:
    matchLabels: {app: renewguard-api}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
